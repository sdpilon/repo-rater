name: Pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pipeline
        run: pnpm run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # GitHub disallows a repo secret literally named GITHUB_TOKEN
          # (reserved for Actions' own automatic per-run token), so the
          # broad, account-wide PAT the pipeline's Octokit client needs is
          # stored as PIPELINE_GH_TOKEN instead — same name the app code
          # reads (see src/pipeline/github/client.ts's createOctokit).
          PIPELINE_GH_TOKEN: ${{ secrets.PIPELINE_GH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
