name: Pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pipeline
        run: pnpm run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The pipeline's Octokit client reads the literal `GITHUB_TOKEN` env
          # var (see app/src/pipeline/github/client.ts's createOctokit) and
          # needs a broad, account-wide PAT (it discovers/reads every repo in
          # the account via listForAuthenticatedUser) — not GitHub Actions'
          # automatic, repo-scoped GITHUB_TOKEN. GitHub also disallows
          # creating a repo secret literally named GITHUB_TOKEN (secret names
          # can't start with the GITHUB_ prefix), so the PAT is stored under
          # a differently-named secret and mapped to the env var the app
          # expects here.
          GITHUB_TOKEN: ${{ secrets.PIPELINE_GH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
