name: Feature request
description: Suggest an idea for this project
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What's annoying, missing, or broken without it — not just "it would be nice to have."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What's your proposed solution?
      description: Leave blank if you just want to raise the problem and let someone else figure out the fix.
    validations:
      required: false
